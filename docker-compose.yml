services:
  amneziawg-socks:
    # Locally built image (see README, "Build" section). No build: section
    # here on purpose, so a plain `docker compose up` never rebuilds the
    # image and just runs the one you already built.
    image: amneziawg-socks:latest
    container_name: amneziawg-socks
    restart: unless-stopped
    # Many Docker hosts (Docker Desktop, WSL2, restricted VMs) refuse to
    # apply net.ipv4.conf.all.src_valid_mark from inside the container even
    # with cap_add: NET_ADMIN + sysctls: — awg-quick then fails with
    # "Read-only file system" and the container restart-loops without ever
    # starting the proxy. privileged: true is the reliable default here.
    #
    # On a hardened Linux host (bare metal/VPS) you can usually replace it
    # with the more restrictive:
    #   cap_add:
    #     - NET_ADMIN
    #   devices:
    #     - /dev/net/tun
    #   sysctls:
    #     net.ipv4.conf.all.src_valid_mark: 1
    privileged: true
    volumes:
      - ./amnezia-wg.conf:/conf/awg0.conf:ro
    environment:
      AWG_CONF_FILE: /conf/awg0.conf
      SOCKS5_PORT: "1080"
      # SOCKS5_USER: "myuser"
      # SOCKS5_PASS: "mypass"
      HTTP_PROXY_PORT: "8118"
      # HTTP_PROXY_ENABLED: "0"
      # AWG_WATCHDOG_INTERVAL: "60"
    ports:
      - "1080:1080"
      - "8118:8118"
